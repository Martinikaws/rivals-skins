<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivals Official Skin Configurator & Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg: #0a0c10;
            --nav: #0d1117;
            --card: #10141a;
            --card-2: #141920;
            --line: #1d232c;
            --line-soft: #181d25;
            --txt: #e6edf5;
            --muted: #7e8896;
            --muted-2: #59626e;
            --blue: #2f6feb;
            --blue-hi: #4a82f0;
        }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--txt);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 72px;
        }
        a { color: inherit; text-decoration: none; }

        .nav {
            position: sticky; top: 0; z-index: 60;
            display: flex; align-items: center; gap: 18px;
            padding: 0 16px; height: 52px;
            background: var(--nav);
            border-bottom: 1px solid var(--line);
            overflow-x: auto; scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav-brand {
            display: flex; align-items: center; gap: 9px;
            font-weight: 600; font-size: 14px; white-space: nowrap;
        }
        .nav-logo {
            width: 22px; height: 22px; border-radius: 6px;
            background: linear-gradient(135deg, #3b7bf0, #8b5cf6);
            flex: none;
        }
        .nav-tabs { display: flex; align-items: center; gap: 4px; }
        .nav-tab {
            padding: 6px 12px; border-radius: 7px;
            color: var(--muted); font-size: 13px; font-weight: 500;
            white-space: nowrap; cursor: pointer;
            background: none; border: 0; font-family: inherit;
        }
        .nav-tab:hover { color: var(--txt); background: #151b23; }
        .nav-tab.active { color: var(--txt); background: #1b2129; }

        .page-wrap { max-width: 900px; margin: 0 auto; padding: 0 12px; }

        .dash-top {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; padding: 18px 0 14px;
        }
        .dash-switch {
            display: flex; gap: 4px; padding: 3px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: 9px;
        }
        .dash-switch-btn {
            padding: 6px 14px; border-radius: 6px; border: 0;
            background: none; color: var(--muted);
            font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
        }
        .dash-switch-btn:hover { color: var(--txt); }
        .dash-switch-btn.active { background: #232a34; color: var(--txt); }
        .dash-actions { display: flex; gap: 8px; }

        .btn-primary, .btn-ghost {
            font-family: inherit; font-weight: 500; cursor: pointer;
            border-radius: 8px; padding: 8px 14px; font-size: 13px;
            transition: background .15s, border-color .15s;
        }
        .btn-primary { background: var(--blue); border: 1px solid var(--blue); color: #fff; }
        .btn-primary:hover { background: var(--blue-hi); border-color: var(--blue-hi); }
        .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--txt); }
        .btn-ghost:hover { background: var(--card-2); border-color: #2b333f; }
        .btn-sm { padding: 6px 12px; font-size: 12.5px; }

        .adv-toggle.active { border-color: #9db4d8; color: #cfe0fa; }
        .adv-note { flex-basis: 100%; font-size: 12.5px; color: #8b9bb4; padding-top: 2px; }
        .skin-option-remove { color: #e07b7b; }
        .skin-option-taken { opacity: .38; }
        .sky-card { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
        .sky-card:last-child { border-bottom: 0; }
        .sky-card:hover { background: var(--card-2); }
        .sky-card.active { background: var(--card-2); }
        .sky-thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: var(--card-2); flex: 0 0 auto; }
        .sky-name { font-size: 14px; font-weight: 600; }
        .sky-sub { font-size: 12px; color: #8b9bb4; }
        .sky-custom input { width: 220px; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; color: inherit; padding: 8px 10px; font-size: 13px; }
        .sky-six { flex-wrap: wrap; }
        .sky-six-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
        .sky-face { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8b9bb4; }
        .sky-face input { width: 108px; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; color: #e6edf6; padding: 7px 9px; font-size: 12.5px; }
        @media (max-width: 640px) { .sky-six-grid { margin-left: 0; } .sky-face input { width: 92px; } }
        .sky-thumb-fallback { width: 54px; height: 54px; border-radius: 8px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #cfe0fa; background: linear-gradient(150deg, #2b3550, #171d2b); border: 1px solid var(--line); }
        .sky-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .sky-mini { background: transparent; border: 1px solid var(--line); color: #8b9bb4; border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
        .sky-mini:hover { color: #e6edf6; border-color: #4a5570; }
        .sky-add { display: flex; gap: 8px; align-items: center; margin-left: auto; }
        .sky-add input { width: 150px; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; color: #e6edf6; padding: 7px 9px; font-size: 12.5px; }
        .util-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-bottom: 14px; }
        .search-box { position: relative; flex: 1 1 220px; min-width: 180px; }
        .search-box input {
            width: 100%; padding: 8px 12px 8px 32px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: 8px; color: var(--txt);
            font-family: inherit; font-size: 13px; outline: none;
        }
        .search-box input::placeholder { color: var(--muted-2); }
        .search-box input:focus { border-color: #2b3947; }
        .search-icon {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            font-size: 12px; opacity: .5; pointer-events: none;
        }

        .dash-grid { display: flex; flex-direction: column; gap: 14px; }
        .weapon-card {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; overflow: hidden;
        }
        .card-label {
            padding: 11px 14px 9px;
            font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
            text-transform: uppercase; color: var(--muted);
            border-bottom: 1px solid var(--line-soft);
        }
        .weapon-row {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 14px; cursor: pointer;
            border-bottom: 1px solid var(--line-soft);
            transition: background .12s;
        }
        .weapon-row:last-child { border-bottom: 0; }
        .weapon-row:hover { background: var(--card-2); }
        .weapon-icon {
            width: 64px; height: 64px; flex: none;
            border-radius: 10px; background: #161c24;
            border: 1px solid var(--line);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .weapon-icon img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.45); }
        .weapon-icon svg, .skin-option-icon svg { width: 100%; height: 100%; display: block; }
        .wrap-search {
            position: sticky; top: 0; z-index: 1;
            width: 100%; margin-bottom: 6px; padding: 8px 12px;
            background: var(--card-2); border: 1px solid var(--line); border-radius: 8px;
            color: var(--txt); font-family: inherit; font-size: 13px; outline: none;
        }
        .wrap-search:focus { border-color: #2b3947; }
        .skin-option-sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
        [hidden] { display: none !important; }
        .weapon-info { flex: 1; min-width: 0; }
        .weapon-name {
            font-size: 14.5px; font-weight: 500; color: var(--txt);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .weapon-skin {
            font-size: 12px; color: var(--muted); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .weapon-skin.is-set { color: #9db4d8; }
        .weapon-chevron { color: var(--muted-2); font-size: 17px; flex: none; }

        .empty-note { padding: 26px 14px; text-align: center; color: var(--muted); font-size: 13px; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(4, 6, 9, .72);
            align-items: center; justify-content: center; padding: 16px;
        }
        .modal {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 14px; width: 100%; max-width: 460px;
            max-height: 82vh; display: flex; flex-direction: column;
            box-shadow: 0 18px 50px rgba(0,0,0,.55);
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid var(--line);
        }
        .modal-header h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
        .modal-close {
            background: none; border: 0; color: var(--muted);
            font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
        }
        .modal-close:hover { color: var(--txt); background: var(--card-2); }
        .modal-body { padding: 8px; overflow-y: auto; }
        .modal-footer {
            display: flex; gap: 8px; justify-content: flex-end;
            padding: 12px 16px; border-top: 1px solid var(--line);
        }
        .skin-option {
            display: flex; align-items: center; gap: 13px;
            padding: 10px 10px; border-radius: 10px; cursor: pointer;
            border: 1px solid transparent;
        }
        .skin-option:hover { background: var(--card-2); }
        .skin-option.active { background: #182233; border-color: #2b4a77; }
        .skin-option-icon {
            width: 56px; height: 56px; flex: none; border-radius: 9px;
            background: #161c24; border: 1px solid var(--line);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .skin-option-icon img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.45); }
        .skin-option-name { flex: 1; font-size: 13.5px; }
        .skin-option-rarity { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
        .skin-check { color: var(--blue); font-size: 13px; }
        .code-preview {
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: 12px; line-height: 1.65; color: #b7c6da;
            background: #0b0f14; border: 1px solid var(--line);
            border-radius: 9px; padding: 12px; white-space: pre-wrap;
            max-height: 46vh; overflow: auto;
        }

        .footbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px; background: var(--nav);
            border-top: 1px solid var(--line);
        }
        .foot-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
        .foot-dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; flex: none; }
        .foot-spacer { flex: 1; }

        .toast {
            position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%) translateY(14px);
            background: #182233; border: 1px solid #27384f; color: var(--txt);
            padding: 10px 16px; border-radius: 9px; font-size: 13px;
            opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 120;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 560px) {
            .dash-top { padding-top: 14px; }
            .dash-actions { width: 100%; }
            .dash-actions .btn-primary, .dash-actions .btn-ghost { flex: 1; }
            .footbar .btn-ghost { display: none; }
            .weapon-icon { width: 54px; height: 54px; }
            .skin-option-icon { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>
    <script src="assets/wraps.js"></script>

    <nav class="nav">
        <div class="nav-brand"><span class="nav-logo"></span>Skin Changer</div>
    </nav>

    <div class="page-wrap" id="dashboard">
        <div class="dash-top">
            <div class="dash-switch">
                <button class="dash-switch-btn active" id="switch-skins" onclick="setDashMode('skins')">Weapon Skins</button>
                <button class="dash-switch-btn" id="switch-wraps" onclick="setDashMode('wraps')">Wraps</button>
                <button class="dash-switch-btn" id="switch-skybox" onclick="setDashMode('skybox')">Skybox</button>
            </div>
            <div class="dash-actions">
                <button class="btn-ghost btn-sm" onclick="openPreview()">Config Preview</button>
                <button class="btn-primary btn-sm" onclick="downloadConfig()">Save Config</button>
            </div>
        </div>

        <div class="util-row">
            <div class="search-box">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="searchInput" placeholder="Search weapons or skins..." oninput="filterWeapons()">
            </div>
            <button class="btn-ghost btn-sm skins-only" onclick="applyPreset('arch')">Arch Set</button>
            <button class="btn-ghost btn-sm skins-only" onclick="applyPreset('key')">Key Set</button>
            <button class="btn-ghost btn-sm skins-only" onclick="applyPreset('pixel')">Pixel Set</button>
            <button class="btn-ghost btn-sm adv-toggle" id="advToggle" onclick="setDashMode(dashMode === 'advanced' ? 'skins' : 'advanced')">Advanced</button>
            <button class="btn-ghost btn-sm wraps-only" onclick="applyPreset('dev')" hidden>Dev Set</button>
            <button class="btn-ghost btn-sm" onclick="applyPreset('default')">Reset</button>
            <div class="adv-note adv-only" hidden>Equip a skin you own and it looks like another skin of the same weapon. Saved into rivals_config.lua with your other skins.</div>
        </div>

        <div class="dash-grid" id="dash-grid"></div>
    </div>

    <div class="modal-overlay" id="skinModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="skinModalTitle">Select Skin</h3>
                <button class="modal-close" onclick="closeSkinModal()">&#10005;</button>
            </div>
            <div class="modal-body" id="skinModalBody"></div>
        </div>
    </div>

    <!-- Code Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="previewTitle">📜 rivals_config.lua Output</h3>
                <button class="modal-close" onclick="closePreview()">✕</button>
            </div>
            <div class="modal-body">
                <div class="code-preview" id="codeText"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="copyConfig()">📋 Copy to Clipboard</button>
                <button class="btn-primary" onclick="downloadConfig()">💾 Download File</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✅ Config copied to clipboard!</div>

    "skins": [
      "Standard",
      "Cyber Warpstone",
      "Electropunk Warpstone",
      "Glorious Warpstone",
      "Teleport Disc",
      "Unstable Warpstone",
      "Warp Juice",
      "Warpbone",
      "Warpeye",
      "Warpstar"
    ]
  },
  {
    "id": "wildcat",
    "name": "Wildcat",
    "category": "Primary",
    "skins": [
      "Standard",
      "Glorious Wildcat",
      "Plasma Wildcat"
    ]
  }
];

        const RARITY_THEMES = {
            "Common": { color: "#8b9bb4", bg: "radial-gradient(circle at center, rgba(139,155,180,0.18) 0%, rgba(10,12,16,0.95) 100%)" },
            "Rare": { color: "#00d2ff", bg: "radial-gradient(circle at center, rgba(0,210,255,0.22) 0%, rgba(10,12,16,0.95) 100%)" },
            "Legendary": { color: "#ffaa00", bg: "radial-gradient(circle at center, rgba(255,170,0,0.25) 0%, rgba(10,12,16,0.95) 100%)" },
            "Mythical": { color: "#ff007f", bg: "radial-gradient(circle at center, rgba(255,0,127,0.28) 0%, rgba(10,12,16,0.95) 100%)" },
            "Unique": { color: "#9d4edd", bg: "radial-gradient(circle at center, rgba(157,78,221,0.28) 0%, rgba(10,12,16,0.95) 100%)" }
        };

        function getSkinVisual(weaponName, skinName) {
            const weaponData = SKIN_ICON_MAP[weaponName] || {};
            const skinData = weaponData[skinName] || weaponData["Standard"] || weaponData["Default"] || {};
            const rarity = skinData.rarity || "Common";
            const theme = RARITY_THEMES[rarity] || RARITY_THEMES["Common"];
            const src = skinData.src || "assets/images/" + (skinName === "Standard" || skinName === "Default" ? weaponName.toLowerCase().replace(/[^a-z0-9]/g, '-') : skinName.toLowerCase().replace(/[^a-z0-9]/g, '-')) + ".png";
            const cdnUrl = skinData.cdnUrl || "";

            return {
                src: src,
                cdnUrl: cdnUrl,
                rarity: rarity.toUpperCase(),
                color: theme.color,
                bg: theme.bg
            };
        }

        let currentConfig = {};
        let activeCategory = "all";
        let dashMode = "skins";

        function init() {
            const saved = localStorage.getItem("rivals_config_saved");
            if (saved) {
                try { currentConfig = JSON.parse(saved); } catch(e) {}
            }
            try { wrapConfig = JSON.parse(localStorage.getItem("rivals_wraps_saved") || "{}") || {}; } catch (e) { wrapConfig = {}; }
            try { advConfig = JSON.parse(localStorage.getItem("rivals_skinswaps_saved") || "{}") || {}; } catch (e) { advConfig = {}; }
            let mode = "skins";
            try { mode = location.hash === "#wraps" ? "wraps" : (localStorage.getItem("rivals_dash_mode") || "skins"); } catch (e) {}
            try { skyConfig = JSON.parse(localStorage.getItem("rivals_skybox_saved") || "{}") || {}; } catch (e) { skyConfig = {}; }
            loadCustomSkies();
            loadSharedSkies();
            try { lightConfig = JSON.parse(localStorage.getItem("rivals_lighting_saved") || "{}") || {}; } catch (e) { lightConfig = {}; }
            setDashMode(["wraps", "advanced", "skybox"].indexOf(mode) >= 0 ? mode : "skins");
        }

        const CATEGORY_ORDER = ["Primary", "Secondary", "Melee", "Utility"];

        function setDashMode(mode) {
            dashMode = mode;
            document.getElementById("switch-skins").classList.toggle("active", mode === "skins" || mode === "advanced");
            document.getElementById("advToggle").classList.toggle("active", mode === "advanced");
            document.getElementById("switch-skybox").classList.toggle("active", mode === "skybox");
            document.getElementById("advToggle").hidden = mode !== "skins" && mode !== "advanced";
            document.querySelectorAll(".adv-only").forEach(function (b) { b.hidden = mode !== "advanced"; });
            document.getElementById("switch-wraps").classList.toggle("active", mode === "wraps");
            document.querySelectorAll(".skins-only").forEach(function (b) { b.hidden = mode !== "skins"; });
            document.querySelectorAll(".wraps-only").forEach(function (b) { b.hidden = mode !== "wraps"; });
            const input = document.getElementById("searchInput");
            if (input) { input.value = ""; input.placeholder = mode === "wraps" ? "Search wraps..." : (mode === "advanced" ? "Search weapons..." : "Search weapons or skins..."); }
            const fd = document.getElementById("footDownload");
            if (fd) fd.textContent = "Download " + configFileName();
            try { localStorage.setItem("rivals_dash_mode", mode); } catch (e) {}
            renderGrid();
            filterWeapons();
        }

        function isCustom(skin) {
            return skin && skin !== "Default" && skin !== "Standard";
        }

        function makeIcon(visual, id) {
            const img = document.createElement("img");
            if (id) img.id = id;
            img.alt = "";
            img.onerror = function () {
                if (visual.cdnUrl && this.src !== visual.cdnUrl) { this.src = visual.cdnUrl; }
                else { this.style.display = "none"; }
            };
            img.src = visual.src;
            return img;
        }

        function renderGrid() {
            const grid = document.getElementById("dash-grid");
            grid.innerHTML = "";

            if (dashMode === "wraps") {
                renderWrapGrid(grid);
                updateFootCount();
                return;
            }
            if (dashMode === "skybox") {
                renderSkyGrid(grid);
                updateFootCount();
                return;
            }
            const adv = dashMode === "advanced";

            CATEGORY_ORDER.forEach(function (cat) {
                const weapons = OFFICIAL_WEAPON_DATA.filter(function (w) { return w.category === cat; });
                if (!weapons.length) return;

                const card = document.createElement("div");
                card.className = "weapon-card";
                card.dataset.category = cat;

                const label = document.createElement("div");
                label.className = "card-label";
                label.textContent = cat;
                card.appendChild(label);

                weapons.forEach(function (weapon) {
                    const swaps = advConfig[weapon.name] || {};
                    const firstOwned = Object.keys(swaps)[0];
                    const selected = adv ? (firstOwned ? swaps[firstOwned] : "Default") : (currentConfig[weapon.name] || "Default");
                    const visual = getSkinVisual(weapon.name, selected);
                    const safeId = weapon.name.replace(/[^a-zA-Z0-9]/g, "_");

                    const row = document.createElement("div");
                    row.className = "weapon-row";
                    row.id = "row-" + safeId;
                    row.dataset.name = weapon.name.toLowerCase();
                    row.addEventListener("click", function () { if (adv) openSwapModal(weapon.name); else openSkinModal(weapon.name); });

                    const iconWrap = document.createElement("div");
                    iconWrap.className = "weapon-icon";
                    iconWrap.appendChild(makeIcon(visual, "icon-" + safeId));

                    const info = document.createElement("div");
                    info.className = "weapon-info";
                    const nameEl = document.createElement("div");
                    nameEl.className = "weapon-name";
                    nameEl.textContent = weapon.name;
                    const skinEl = document.createElement("div");
                    skinEl.className = "weapon-skin" + (isCustom(selected) ? " is-set" : "");
                    skinEl.id = "skin-" + safeId;
                    skinEl.textContent = adv ? swapSummary(weapon.name) : selected;
                    info.appendChild(nameEl);
                    info.appendChild(skinEl);

                    const chev = document.createElement("div");
                    chev.className = "weapon-chevron";
                    chev.innerHTML = "&#8250;";

                    row.appendChild(iconWrap);
                    row.appendChild(info);
                    row.appendChild(chev);
                    card.appendChild(row);
                });

                grid.appendChild(card);
            });

            updateFootCount();
        }

        // ---- Wraps tab ----
        // Rows are wraps you own; the picker sets the wrap each should look
        // like. Saved as rivals_wraps.lua, which RivalsWrapChanger.lua reads.
        let wrapConfig = {};
        // MISSING_WRAP is the game's placeholder, not a wrap anyone can pick.
        const WRAP_LIST = (window.WRAPS || []).filter(function (w) { return w[0].indexOf('MISSING_') < 0; });
        const WRAP_RARITY = window.WRAP_RARITIES || [];
        const WRAP_BY_NAME = {};
        WRAP_LIST.forEach(function (w) { WRAP_BY_NAME[w[0]] = w; });
        const WRAP_TESTED = { "Glass": true, "Dark Matter": true };
        // Game rarity colors, lifted where the raw value vanishes on the dark ground.
        const WRAP_RARITY_TEXT = { "#000000": "#9aa3ae", "#385021": "#7fa35a", "#4044ba": "#8185f2" };

        function wrapRarityName(i) { return WRAP_RARITY[i] ? WRAP_RARITY[i][0] : "Other"; }
        function wrapRarityColor(i) { const c = WRAP_RARITY[i] ? WRAP_RARITY[i][1] : "#8b9bb4"; return WRAP_RARITY_TEXT[c] || c; }
        // Skins, skin swaps and wraps all save into one rivals_config.lua.
        function configFileName() { return "rivals_config.lua"; }

        // Shared SVG paint for the wrap previews: shading, material effects and
        // one card gradient per rarity (black at the top, rarity color below).
        (function () {
            let defs = '<linearGradient id="wg-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>'
                + '<linearGradient id="wg-metal" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity=".55"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'
                + '<radialGradient id="wg-gloss" cx=".35" cy=".2" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'
                + '<pattern id="wg-ff" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="5" fill="#fff" fill-opacity=".35"/></pattern>'
                + '<filter id="wg-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
            WRAP_RARITY.forEach(function (r, i) {
                defs += '<linearGradient id="wg-bg-' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset=".12" stop-color="#050608"/><stop offset=".72" stop-color="' + r[1] + '"/><stop offset="1" stop-color="' + r[1] + '"/></linearGradient>';
            });
            const holder = document.createElement("div");
            holder.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="wg-defs">' + defs + '</defs></svg>';
            document.body.appendChild(holder.firstChild);
        })();

        // The game's wrap icon is Assets.Misc.Wrap, a curled sheet shown on a
        // rarity card: layer 1 paints the sheet and, at half brightness, its
        // roll; layer 2 paints the band along the bottom; layer 3 isn't on it.
        const WRAP_FACE = "M24 14C46 8 64 16 96 9L91 63C67 61 41 67 7 59Z";
        const WRAP_BAND = "M7 59C41 67 67 61 91 63L89 82C65 80 41 86 4 78Z";
        const WRAP_ROLL = "M24 14L7 59L4 78L11 78L14 59L30 16Z";
        const wrapPatterns = {};
        function wrapTexture(id) {
            if (!wrapPatterns[id]) {
                const ns = "http://www.w3.org/2000/svg";
                const p = document.createElementNS(ns, "pattern");
                p.setAttribute("id", "wt-" + id);
                p.setAttribute("patternUnits", "userSpaceOnUse");
                p.setAttribute("width", "36");
                p.setAttribute("height", "36");
                const img = document.createElementNS(ns, "image");
                img.setAttribute("href", "assets/images/wraps/" + id + ".png");
                img.setAttribute("width", "36");
                img.setAttribute("height", "36");
                img.setAttribute("preserveAspectRatio", "xMidYMid slice");
                p.appendChild(img);
                document.getElementById("wg-defs").appendChild(p);
                wrapPatterns[id] = true;
            }
            return "url(#wt-" + id + ")";
        }
        function shadeHex(hex, f) {
            const n = parseInt((hex || "#8b93a1").slice(1), 16);
            return "#" + [(n >> 16) & 255, (n >> 8) & 255, n & 255]
                .map(function (v) { return ("0" + Math.round(v * f).toString(16)).slice(-2); }).join("");
        }
        function wrapLayer(d, g, colorOverride) {
            const kind = g[0], color = colorOverride || g[1] || "#8b93a1", t = g[2] || 0, tex = g[3] || 0;
            const tag = '<path d="' + d + '"';
            let out = tag + ' fill="' + color + '"';
            if (kind === "Glass" || t > 0) out += ' fill-opacity="' + Math.max(0.2, 1 - t).toFixed(2) + '"';
            if (kind === "Neon") out += ' filter="url(#wg-glow)"';
            out += "/>";
            if (tex) out += tag + ' fill="' + wrapTexture(tex) + '" fill-opacity=".65"/>';
            if (kind === "Metal" || kind === "DiamondPlate" || kind === "CorrodedMetal" || kind === "Foil") out += tag + ' fill="url(#wg-metal)"/>';
            else if (kind === "ForceField") out += tag + ' fill="url(#wg-ff)"/>';
            else if (kind === "Glass" || kind.indexOf("v:") === 0) out += tag + ' fill="url(#wg-gloss)"/>';
            return out;
        }
        function wrapIconSVG(w) {
            const g = (w && w[3]) || [];
            const g1 = g[0] || ["SmoothPlastic", "#3a414c", 0, 0], g2 = g[1] || g1;
            return '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">'
                + '<rect x="1.5" y="1.5" width="97" height="97" rx="7" fill="url(#wg-bg-' + (w ? w[1] : 0) + ')" stroke="' + (WRAP_RARITY[w ? w[1] : 0] || ["", "#59626e"])[1] + '" stroke-width="3"/>'
                + wrapLayer(WRAP_FACE, g1) + wrapLayer(WRAP_BAND, g2)
                + '<path d="' + WRAP_FACE + '" fill="url(#wg-shade)"/>'
                + wrapLayer(WRAP_ROLL, g1, shadeHex(g1[1], 0.5))
                + "</svg>";
        }

        function renderWrapGrid(grid) {
            const groups = {};
            WRAP_LIST.forEach(function (w) { (groups[w[1]] = groups[w[1]] || []).push(w); });
            Object.keys(groups).map(Number).sort(function (a, b) { return a - b; }).forEach(function (ri) {
                const card = document.createElement("div");
                card.className = "weapon-card";
                const label = document.createElement("div");
                label.className = "card-label";
                label.textContent = wrapRarityName(ri) + " wraps";
                card.appendChild(label);
                groups[ri].forEach(function (w) {
                    const row = document.createElement("div");
                    row.className = "weapon-row";
                    row.addEventListener("click", function () { openWrapModal(w[0]); });
                    const iconWrap = document.createElement("div");
                    iconWrap.className = "weapon-icon";
                    const info = document.createElement("div");
                    info.className = "weapon-info";
                    const nameEl = document.createElement("div");
                    nameEl.className = "weapon-name";
                    nameEl.textContent = w[0];
                    const sub = document.createElement("div");
                    sub.className = "weapon-skin";
                    info.appendChild(nameEl);
                    info.appendChild(sub);
                    const chev = document.createElement("div");
                    chev.className = "weapon-chevron";
                    chev.innerHTML = "&#8250;";
                    row.appendChild(iconWrap);
                    row.appendChild(info);
                    row.appendChild(chev);
                    card.appendChild(row);
                    paintWrapRow(row, w[0]);
                });
                grid.appendChild(card);
            });
        }

        function paintWrapRow(row, name) {
            const target = wrapConfig[name];
            row.querySelector(".weapon-icon").innerHTML = wrapIconSVG(WRAP_BY_NAME[target] || WRAP_BY_NAME[name]);
            const sub = row.querySelector(".weapon-skin");
            sub.textContent = target ? "Looks like " + target : "Default";
            sub.classList.toggle("is-set", !!target);
            row.dataset.name = (name + " " + (target || "")).toLowerCase();
            row.dataset.wrap = name;
        }

        function openWrapModal(name) {
            modalWeapon = name;
            document.getElementById("skinModalTitle").textContent = name + " looks like...";
            const body = document.getElementById("skinModalBody");
            body.innerHTML = "";
            const search = document.createElement("input");
            search.type = "text";
            search.className = "wrap-search";
            search.placeholder = "Search wraps...";
            search.setAttribute("aria-label", "Search wraps to show");
            body.appendChild(search);
            const current = wrapConfig[name] || null;
            const options = [];
            function addOption(label, subText, w, rarityIdx, target) {
                const active = target === current;
                const opt = document.createElement("div");
                opt.className = "skin-option" + (active ? " active" : "");
                opt.dataset.name = label.toLowerCase();
                opt.addEventListener("click", function () { onWrapChange(name, target); closeSkinModal(); });
                const ic = document.createElement("div");
                ic.className = "skin-option-icon";
                ic.innerHTML = wrapIconSVG(w);
                const nm = document.createElement("div");
                nm.className = "skin-option-name";
                nm.textContent = label;
                const st = document.createElement("span");
                st.className = "skin-option-sub";
                st.textContent = subText;
                if (subText === "Tested in game") st.style.color = "#3fb950";
                nm.appendChild(st);
                opt.appendChild(ic);
                opt.appendChild(nm);
                if (rarityIdx !== null) {
                    const ra = document.createElement("div");
                    ra.className = "skin-option-rarity";
                    ra.style.color = wrapRarityColor(rarityIdx);
                    ra.textContent = wrapRarityName(rarityIdx);
                    opt.appendChild(ra);
                }
                if (active) {
                    const ck = document.createElement("span");
                    ck.className = "skin-check";
                    ck.innerHTML = "&#10003;";
                    opt.appendChild(ck);
                }
                body.appendChild(opt);
                options.push(opt);
            }
            addOption("Default", "Keep " + name + "'s own look", WRAP_BY_NAME[name], null, null);
            WRAP_LIST.slice().sort(function (a, b) { return b[1] - a[1] || a[0].localeCompare(b[0]); }).forEach(function (w) {
                if (w[0] !== name) addOption(w[0], WRAP_TESTED[w[0]] ? "Tested in game" : "", w, w[1], w[0]);
            });
            search.addEventListener("input", function () {
                const q = search.value.trim().toLowerCase();
                options.forEach(function (o) { o.style.display = !q || o.dataset.name.indexOf(q) !== -1 ? "flex" : "none"; });
            });
            document.getElementById("skinModal").style.display = "flex";
            search.focus();
        }

        function onWrapChange(name, target) {
            if (target) wrapConfig[name] = target; else delete wrapConfig[name];
            localStorage.setItem("rivals_wraps_saved", JSON.stringify(wrapConfig));
            document.querySelectorAll("#dash-grid .weapon-row").forEach(function (row) {
                if (row.dataset.wrap === name) paintWrapRow(row, name);
            });
            updateFootCount();
            showToast(target ? name + " now looks like " + target : name + " is back to Default");
        }

        function generateWrapLines() {
            const keys = Object.keys(wrapConfig).sort();
            if (!keys.length) return [];
            return ["", "[Wraps]",
                    "-- One line per wrap, OwnedWrap=TargetWrap: equip OwnedWrap on any",
                    "-- weapon and it looks like TargetWrap."]
                .concat(keys.map(function (k) { return k + "=" + wrapConfig[k]; }));
        }

        // ---- Advanced: owned-skin swaps ----
        // advConfig[weapon][ownedSkin] = targetSkin. Written into rivals_config.lua
        // as "Weapon | OwnedSkin > TargetSkin" lines, which the skin changer reads
        // after the Weapon=Skin lines (older builds skip them).
        let advConfig = {};

        function swapSummary(weaponName) {
            const swaps = advConfig[weaponName] || {};
            const keys = Object.keys(swaps);
            if (!keys.length) return "No swaps";
            return keys.map(function (k) { return k + " \u2192 " + swaps[k]; }).join(", ");
        }

        function swapCount() {
            let n = 0;
            Object.keys(advConfig).forEach(function (w) { n += Object.keys(advConfig[w] || {}).length; });
            return n;
        }

        function saveAdvConfig() {
            Object.keys(advConfig).forEach(function (w) { if (!Object.keys(advConfig[w] || {}).length) delete advConfig[w]; });
            try { localStorage.setItem("rivals_skinswaps_saved", JSON.stringify(advConfig)); } catch (e) {}
        }

        function skinPickerOption(weaponName, skin, active, extraClass, onPick) {
            const v = getSkinVisual(weaponName, skin);
            const opt = document.createElement("div");
            opt.className = "skin-option" + (active ? " active" : "") + (extraClass ? " " + extraClass : "");
            opt.addEventListener("click", onPick);
            const ic = document.createElement("div");
            ic.className = "skin-option-icon";
            ic.appendChild(makeIcon(v, null));
            const nm = document.createElement("div");
            nm.className = "skin-option-name";
            nm.textContent = skin;
            const ra = document.createElement("div");
            ra.className = "skin-option-rarity";
            ra.style.color = v.color;
            ra.textContent = v.rarity;
            opt.appendChild(ic);
            opt.appendChild(nm);
            opt.appendChild(ra);
            if (active) {
                const ck = document.createElement("span");
                ck.className = "skin-check";
                ck.innerHTML = "&#10003;";
                opt.appendChild(ck);
            }
            return opt;
        }

        function realSkins(weapon) {
            return weapon.skins.filter(function (s) { return isCustom(s); });
        }

        // Step 1: the skin you own.
        function openSwapModal(weaponName) {
            const weapon = OFFICIAL_WEAPON_DATA.find(function (w) { return w.name === weaponName; });
            if (!weapon) return;
            const swaps = advConfig[weaponName] || {};
            document.getElementById("skinModalTitle").textContent = weaponName + " \u2014 skin you own";
            const body = document.getElementById("skinModalBody");
            body.innerHTML = "";
            realSkins(weapon).forEach(function (skin) {
                const opt = skinPickerOption(weaponName, skin, !!swaps[skin], null, function () { openSwapTargetModal(weaponName, skin); });
                if (swaps[skin]) opt.querySelector(".skin-option-rarity").textContent = "\u2192 " + swaps[skin];
                body.appendChild(opt);
            });
            document.getElementById("skinModal").style.display = "flex";
            body.scrollTop = 0;
        }

        // Step 2: the skin it should look like.
        function openSwapTargetModal(weaponName, owned) {
            const weapon = OFFICIAL_WEAPON_DATA.find(function (w) { return w.name === weaponName; });
            if (!weapon) return;
            const current = (advConfig[weaponName] || {})[owned];
            document.getElementById("skinModalTitle").textContent = owned + " looks like...";
            const body = document.getElementById("skinModalBody");
            body.innerHTML = "";
            if (current) {
                const rm = document.createElement("div");
                rm.className = "skin-option skin-option-remove";
                rm.textContent = "Remove swap (" + owned + " \u2192 " + current + ")";
                rm.addEventListener("click", function () { onSwapChange(weaponName, owned, null); });
                body.appendChild(rm);
            }
            // A skin's model is moved, not copied, so it can only stand in for one
            // owned skin: a target already taken here or by the weapon's own skin
            // line would be skipped by the changer.
            const swaps = advConfig[weaponName] || {};
            const taken = {};
            Object.keys(swaps).forEach(function (o) { if (o !== owned) { taken[swaps[o]] = o; taken[o] = o; } });
            if (isCustom(currentConfig[weaponName])) taken[currentConfig[weaponName]] = weaponName + "'s skin";
            realSkins(weapon).forEach(function (skin) {
                if (skin === owned) return;
                const by = taken[skin];
                const opt = skinPickerOption(weaponName, skin, skin === current, by ? "skin-option-taken" : null, function () {
                    if (by) { showToast(skin + " is already used by " + by); return; }
                    onSwapChange(weaponName, owned, skin);
                });
                if (by) opt.querySelector(".skin-option-rarity").textContent = "in use";
                body.appendChild(opt);
            });
            body.scrollTop = 0;
        }

        function onSwapChange(weaponName, owned, target) {
            advConfig[weaponName] = advConfig[weaponName] || {};
            if (target) advConfig[weaponName][owned] = target; else delete advConfig[weaponName][owned];
            saveAdvConfig();
            closeSkinModal();
            renderGrid();
            filterWeapons();
            showToast(target ? owned + " now looks like " + target : owned + " swap removed");
        }

        function generateSwapLines() {
            const lines = [];
            OFFICIAL_WEAPON_DATA.forEach(function (w) {
                const swaps = advConfig[w.name] || {};
                Object.keys(swaps).sort().forEach(function (owned) { lines.push(w.name + " | " + owned + " > " + swaps[owned]); });
            });
            return lines;
        }

        // ---- Skybox tab ----
        // The game builds the sky in Lighting from a Sky template per map
        // (PlayerScripts...LightingProfiles) and rebuilds it whenever the area
        // changes. The changer rewrites those templates, so the new sky shows on
        // the next map or area load - not instantly.
        const SKYBOXES = [
            {id: "blue", name: "Blue Clouds", sub: "The game's default sky", face: "14147882761"},
            {id: "space", name: "Space", sub: "Dimension and the spooky lobby", face: "10196550367"},
            {id: "graveyard", name: "Graveyard", sub: "Graveyard and Zombie Tower", face: "135908632589654"},
            {id: "sudden death", name: "Sudden Death", sub: "Sudden Death and the final floor", face: "84214501374682"},
            {id: "station", name: "Station", sub: "Station and Big Station", face: "2108482231"},
            {id: "westown", name: "Westown", sub: "The Westown sky", face: "12261809766"},
            {id: "black", name: "Black", sub: "Museum at night - a flat black sky", face: "91612392386438"},
            {id: "classic", name: "Classic Roblox", sub: "The old built-in sky, shipped with the client", face: "classic"}
        ];
        let skyConfig = {};

        function saveSkyConfig() {
            try { localStorage.setItem("rivals_skybox_saved", JSON.stringify(skyConfig)); } catch (e) {}
        }

        // Local copies of each sky's front face, with Roblox's thumbnail
        // endpoint as the fallback when one is missing.
        function skyThumb(assetId) {
            return "assets/images/skies/" + assetId + ".png";
        }
        function skyThumbCdn(assetId) {
            return "https://www.roblox.com/asset-thumbnail/image?assetId=" + assetId + "&width=150&height=150&format=png";
        }

        // Skyboxes you add yourself: six asset ids under a name, kept in this
        // browser. Roblox's thumbnail endpoint is tried for a preview and the
        // card falls back to a plain tile when it refuses (it blocks some
        // browsers and every cross-origin fetch).
        let customSkies = [];

        function loadCustomSkies() {
            try { customSkies = JSON.parse(localStorage.getItem("rivals_skyboxes_custom") || "[]") || []; } catch (e) { customSkies = []; }
        }

        // Skyboxes shared with everyone, from assets/skyboxes.json in the site's
        // repo - no backend, and anyone can add one with a pull request. Roblox
        // only loads its own assets, so these are ids, never image links.
        let sharedSkies = [];

        function loadSharedSkies() {
            fetch("assets/skyboxes.json", {cache: "no-cache"}).then(function (r) { return r.json(); }).then(function (d) {
                sharedSkies = (d && d.skyboxes || []).filter(function (s) {
                    return s && s.name && s.faces && SKY_FACE_ORDER.every(function (k) { return s.faces[k]; });
                });
                if (sharedSkies.length && dashMode === "skybox") renderGrid();
            }).catch(function () { sharedSkies = []; });
        }

        function saveCustomSkies() {
            try { localStorage.setItem("rivals_skyboxes_custom", JSON.stringify(customSkies)); } catch (e) {}
        }

        const SKY_FACE_ORDER = ["ft", "bk", "lf", "rt", "up", "dn"];

        // "Name: ft,bk,lf,rt,up,dn" - what the Copy button puts on the clipboard
        // and what Import reads, so a set can be passed to someone else.
        function skySetToText(sky) {
            return sky.name + ": " + SKY_FACE_ORDER.map(function (k) { return sky.faces[k] || ""; }).join(",");
        }

        function skySetFromText(text) {
            const at = text.indexOf(":");
            if (at < 0) return null;
            const name = text.slice(0, at).trim();
            const ids = text.slice(at + 1).split(",").map(function (v) { return v.replace(/[^0-9]/g, ""); });
            if (!name || ids.length < 6 || ids.filter(Boolean).length < 6) return null;
            const faces = {};
            SKY_FACE_ORDER.forEach(function (k, i) { faces[k] = ids[i]; });
            return {name: name, faces: faces};
        }

        function sameFaces(a, b) {
            if (!a || !b) return false;
            return SKY_FACE_ORDER.every(function (k) { return (a[k] || "") === (b[k] || ""); });
        }

        function addCustomSky(name, faces) {
            customSkies = customSkies.filter(function (s) { return s.name !== name; });
            customSkies.push({name: name, faces: faces});
            saveCustomSkies();
            onSkyChange({faces: faces, name: name});
        }

        function removeCustomSky(name) {
            customSkies = customSkies.filter(function (s) { return s.name !== name; });
            saveCustomSkies();
            if (skyConfig.name === name) { onSkyChange({}); } else { renderGrid(); }
        }

        function skyCardThumb(faceId, fallbackText) {
            const img = document.createElement("img");
            img.className = "sky-thumb";
            img.alt = "";
            img.src = skyThumbCdn(faceId);
            img.onerror = function () {
                const tile = document.createElement("div");
                tile.className = "sky-thumb-fallback";
                tile.textContent = (fallbackText || "?").slice(0, 1).toUpperCase();
                if (this.parentNode) this.parentNode.replaceChild(tile, this);
            };
            return img;
        }

        function renderCustomSkies(card) {
            sharedSkies.forEach(function (sky) {
                const row = document.createElement("div");
                row.className = "sky-card" + (sameFaces(skyConfig.faces, sky.faces) ? " active" : "");
                row.dataset.name = (sky.name + " " + (sky.by || "")).toLowerCase();
                row.appendChild(skyCardThumb(sky.faces.ft, sky.name));
                const info = document.createElement("div");
                info.innerHTML = '<div class="sky-name"></div><div class="sky-sub"></div>';
                info.querySelector(".sky-name").textContent = sky.name;
                info.querySelector(".sky-sub").textContent = sky.by ? "Shared - by " + sky.by : "Shared";
                row.appendChild(info);
                row.addEventListener("click", function () { onSkyChange({faces: sky.faces, name: sky.name}); });
                card.appendChild(row);
            });

            customSkies.forEach(function (sky) {
                const row = document.createElement("div");
                row.className = "sky-card" + (sameFaces(skyConfig.faces, sky.faces) ? " active" : "");
                row.dataset.name = sky.name.toLowerCase();
                row.appendChild(skyCardThumb(sky.faces.ft || sky.faces.bk, sky.name));
                const info = document.createElement("div");
                info.innerHTML = '<div class="sky-name"></div><div class="sky-sub">Yours - 6 faces</div>';
                info.querySelector(".sky-name").textContent = sky.name;
                row.appendChild(info);
                const actions = document.createElement("div");
                actions.className = "sky-actions";
                const copy = document.createElement("button");
                copy.className = "sky-mini";
                copy.textContent = "Copy";
                copy.addEventListener("click", function (e) {
                    e.stopPropagation();
                    navigator.clipboard.writeText(skySetToText(sky));
                    showToast("Copied - paste it to share this skybox");
                });
                const del = document.createElement("button");
                del.className = "sky-mini";
                del.textContent = "Remove";
                del.addEventListener("click", function (e) { e.stopPropagation(); removeCustomSky(sky.name); });
                actions.appendChild(copy);
                actions.appendChild(del);
                row.appendChild(actions);
                row.addEventListener("click", function () { onSkyChange({faces: sky.faces, name: sky.name}); });
                card.appendChild(row);
            });
        }

        function renderSkyAdd(card) {
            const row = document.createElement("div");
            row.className = "sky-card";
            row.dataset.name = "add save skybox import";
            const info = document.createElement("div");
            info.innerHTML = '<div class="sky-name">Save the six above</div><div class="sky-sub">Keeps it here so you can switch back any time</div>';
            row.appendChild(info);
            const box = document.createElement("div");
            box.className = "sky-add";
            const name = document.createElement("input");
            name.placeholder = "Name it";
            const save = document.createElement("button");
            save.className = "sky-mini";
            save.textContent = "Save";
            save.addEventListener("click", function () {
                const faces = skyConfig.faces || {};
                if (SKY_FACE_ORDER.some(function (k) { return !faces[k]; })) { showToast("Fill all six faces first"); return; }
                const n = (name.value || "").trim();
                if (!n) { showToast("Give it a name"); return; }
                addCustomSky(n, faces);
                showToast('Saved "' + n + '"');
            });
            const paste = document.createElement("button");
            paste.className = "sky-mini";
            paste.textContent = "Import";
            paste.addEventListener("click", function () {
                const text = prompt("Paste a skybox someone shared\n(Name: ft,bk,lf,rt,up,dn)");
                if (!text) return;
                const set = skySetFromText(text);
                if (!set) { showToast("That doesn't look like a skybox line"); return; }
                addCustomSky(set.name, set.faces);
                showToast('Imported "' + set.name + '"');
            });
            box.appendChild(name);
            box.appendChild(save);
            box.appendChild(paste);
            row.appendChild(box);
            card.appendChild(row);
        }

        // Lighting sits with the skybox because that is what it is for: a black
        // sky under the game's default brightness still looks like daytime.
        // Unlike the sky it applies the moment the script runs.
        let lightConfig = {};

        function saveLightConfig() {
            try { localStorage.setItem("rivals_lighting_saved", JSON.stringify(lightConfig)); } catch (e) {}
        }

        function onLightChange(conf) {
            lightConfig = conf || {};
            saveLightConfig();
            renderGrid();
            showToast(lightConfig.preset ? "Darker lighting on" : "Lighting left as the game has it");
        }

        function generateLightLines() {
            if (!lightConfig.preset) return [];
            const lines = ["", "[Lighting]", "-- Applied right away and kept across map changes.", "Preset=" + lightConfig.preset];
            if (lightConfig.exposure !== undefined && lightConfig.exposure !== "") lines.push("Exposure=" + lightConfig.exposure);
            return lines;
        }

        function renderLightingRow(card) {
            const row = document.createElement("div");
            row.className = "sky-card" + (lightConfig.preset ? " active" : "");
            row.dataset.name = "lighting darker night exposure";
            const info = document.createElement("div");
            info.innerHTML = '<div class="sky-name">Darker lighting</div><div class="sky-sub">Night-style brightness and ambient - pairs with the Black sky</div>';
            row.appendChild(info);
            const box = document.createElement("div");
            box.className = "sky-add";
            const exp = document.createElement("input");
            exp.placeholder = "exposure -1.3";
            exp.value = lightConfig.exposure !== undefined ? lightConfig.exposure : "";
            exp.title = "Lower is darker. Leave empty for the preset's -1.3.";
            exp.addEventListener("click", function (e) { e.stopPropagation(); });
            exp.addEventListener("change", function () {
                const v = exp.value.trim();
                onLightChange(Object.assign({}, lightConfig, {preset: "dark", exposure: v === "" ? undefined : v}));
            });
            const toggle = document.createElement("button");
            toggle.className = "sky-mini";
            toggle.textContent = lightConfig.preset ? "On" : "Off";
            toggle.addEventListener("click", function (e) {
                e.stopPropagation();
                onLightChange(lightConfig.preset ? {} : {preset: "dark"});
            });
            box.appendChild(exp);
            box.appendChild(toggle);
            row.appendChild(box);
            card.appendChild(row);
        }

        function renderSkyGrid(grid) {
            const card = document.createElement("div");
            card.className = "weapon-card";
            const label = document.createElement("div");
            label.className = "card-label";
            label.textContent = "Skybox";
            card.appendChild(label);

            SKYBOXES.forEach(function (sky) {
                const row = document.createElement("div");
                row.className = "sky-card" + (skyConfig.preset === sky.id && !skyConfig.all ? " active" : "");
                row.dataset.name = sky.name.toLowerCase();
                const img = document.createElement("img");
                img.className = "sky-thumb";
                img.alt = "";
                img.src = skyThumb(sky.face);
                img.onerror = function () {
                    const cdn = skyThumbCdn(sky.face);
                    if (this.src !== cdn) { this.src = cdn; } else { this.style.visibility = "hidden"; }
                };
                const info = document.createElement("div");
                const nm = document.createElement("div");
                nm.className = "sky-name";
                nm.textContent = sky.name;
                const sb = document.createElement("div");
                sb.className = "sky-sub";
                sb.textContent = sky.sub;
                info.appendChild(nm);
                info.appendChild(sb);
                row.appendChild(img);
                row.appendChild(info);
                row.addEventListener("click", function () { onSkyChange({preset: sky.id}); });
                card.appendChild(row);
            });

            // Any Roblox image asset, on all six faces.
            const custom = document.createElement("div");
            custom.className = "sky-card sky-custom" + (skyConfig.all ? " active" : "");
            custom.dataset.name = "custom asset id";
            const cinfo = document.createElement("div");
            cinfo.innerHTML = '<div class="sky-name">Custom asset</div><div class="sky-sub">One image id on all six faces</div>';
            const input = document.createElement("input");
            input.placeholder = "e.g. 10196550367";
            input.value = skyConfig.all || "";
            input.addEventListener("click", function (e) { e.stopPropagation(); });
            input.addEventListener("change", function () {
                const v = input.value.replace(/[^0-9]/g, "");
                onSkyChange(v ? {all: v} : {});
            });
            custom.appendChild(cinfo);
            custom.appendChild(input);
            card.appendChild(custom);

            renderCustomSkies(card);

            // A skybox of your own: six ids, one per face, the way the toolbox
            // sells them. Leaving a face empty keeps that face as it is.
            const faces = skyConfig.faces || {};
            const six = document.createElement("div");
            six.className = "sky-card sky-six" + (Object.keys(faces).length ? " active" : "");
            six.dataset.name = "custom skybox six faces own";
            const sinfo = document.createElement("div");
            sinfo.innerHTML = '<div class="sky-name">Your own skybox</div><div class="sky-sub">Six image ids, one per face</div>';
            six.appendChild(sinfo);
            const grid6 = document.createElement("div");
            grid6.className = "sky-six-grid";
            [["ft", "Front"], ["bk", "Back"], ["lf", "Left"], ["rt", "Right"], ["up", "Up"], ["dn", "Down"]].forEach(function (f) {
                const wrap = document.createElement("label");
                wrap.className = "sky-face";
                const cap = document.createElement("span");
                cap.textContent = f[1];
                const inp = document.createElement("input");
                inp.placeholder = "id";
                inp.value = faces[f[0]] || "";
                inp.addEventListener("click", function (e) { e.stopPropagation(); });
                inp.addEventListener("change", function () {
                    const next = Object.assign({}, skyConfig.faces || {});
                    const v = inp.value.replace(/[^0-9]/g, "");
                    if (v) { next[f[0]] = v; } else { delete next[f[0]]; }
                    onSkyChange(Object.keys(next).length ? {faces: next} : {});
                });
                wrap.appendChild(cap);
                wrap.appendChild(inp);
                grid6.appendChild(wrap);
            });
            six.appendChild(grid6);
            card.appendChild(six);
            renderSkyAdd(card);
            renderLightingRow(card);

            const none = document.createElement("div");
            none.className = "sky-card" + (!skyConfig.preset && !skyConfig.all && !skyConfig.faces ? " active" : "");
            none.dataset.name = "off unchanged";
            none.innerHTML = '<div><div class="sky-name">Off</div><div class="sky-sub">Leave every map\'s own sky alone</div></div>';
            none.addEventListener("click", function () { onSkyChange({}); });
            card.appendChild(none);

            grid.appendChild(card);
        }

        function onSkyChange(conf) {
            skyConfig = conf || {};
            saveSkyConfig();
            renderGrid();
            filterWeapons();
            const picked = SKYBOXES.filter(function (s) { return s.id === skyConfig.preset; })[0];
            const faceCount = Object.keys(skyConfig.faces || {}).length;
            showToast(picked ? picked.name + " sky selected - it shows on the next map load"
                : (skyConfig.all ? "Custom sky set - it shows on the next map load"
                : (faceCount ? faceCount + "/6 faces set - it shows on the next map load" : "Skybox left unchanged")));
        }

        function generateSkyLines() {
            if (skyConfig.all) return ["", "[Skybox]", "-- One image on all six faces. Shows on the next map or area load.", "All=" + skyConfig.all];
            if (skyConfig.preset) return ["", "[Skybox]", "-- Shows on the next map or area load.", "Preset=" + skyConfig.preset];
            const faces = skyConfig.faces || {};
            const keys = ["bk", "dn", "ft", "lf", "rt", "up"].filter(function (k) { return faces[k]; });
            if (!keys.length) return [];
            return ["", "[Skybox]", "-- One image id per face. Shows on the next map or area load."]
                .concat(keys.map(function (k) { return k.toUpperCase() + "=" + faces[k]; }));
        }

        let modalWeapon = null;

        function openSkinModal(weaponName) {
            const weapon = OFFICIAL_WEAPON_DATA.find(function (w) { return w.name === weaponName; });
            if (!weapon) return;
            modalWeapon = weaponName;

            const selected = currentConfig[weaponName] || "Default";
            document.getElementById("skinModalTitle").textContent = weaponName;

            const body = document.getElementById("skinModalBody");
            body.innerHTML = "";

            const skins = weapon.skins.slice();
            if (skins.indexOf("Default") === -1) skins.unshift("Default");

            skins.forEach(function (skin) {
                const v = getSkinVisual(weaponName, skin);
                const active = skin === selected;

                const opt = document.createElement("div");
                opt.className = "skin-option" + (active ? " active" : "");
                opt.addEventListener("click", function () {
                    onSkinChange(weaponName, skin);
                    closeSkinModal();
                });

                const ic = document.createElement("div");
                ic.className = "skin-option-icon";
                ic.appendChild(makeIcon(v, null));

                const nm = document.createElement("div");
                nm.className = "skin-option-name";
                nm.textContent = skin;

                const ra = document.createElement("div");
                ra.className = "skin-option-rarity";
                ra.style.color = v.color;
                ra.textContent = v.rarity;

                opt.appendChild(ic);
                opt.appendChild(nm);
                opt.appendChild(ra);
                if (active) {
                    const ck = document.createElement("span");
                    ck.className = "skin-check";
                    ck.innerHTML = "&#10003;";
                    opt.appendChild(ck);
                }
                body.appendChild(opt);
            });

            document.getElementById("skinModal").style.display = "flex";
        }

        function closeSkinModal() {
            document.getElementById("skinModal").style.display = "none";
            modalWeapon = null;
        }

        function onSkinChange(weaponName, skinName) {
            currentConfig[weaponName] = skinName;
            localStorage.setItem("rivals_config_saved", JSON.stringify(currentConfig));

            const safeId = weaponName.replace(/[^a-zA-Z0-9]/g, "_");
            const visual = getSkinVisual(weaponName, skinName);

            const label = document.getElementById("skin-" + safeId);
            if (label) {
                label.textContent = skinName;
                label.classList.toggle("is-set", isCustom(skinName));
            }

            const icon = document.getElementById("icon-" + safeId);
            if (icon) {
                icon.style.display = "";
                icon.onerror = function () {
                    if (visual.cdnUrl && this.src !== visual.cdnUrl) { this.src = visual.cdnUrl; }
                    else { this.style.display = "none"; }
                };
                icon.src = visual.src;
            }

            updateFootCount();
        }

        function updateFootCount() {
            const el = document.getElementById("footCount");
            if (!el) return;
            if (dashMode === "wraps") {
                const k = Object.keys(wrapConfig).length;
                el.textContent = k + (k === 1 ? " wrap swapped" : " wraps swapped");
                return;
            }
            if (dashMode === "skybox") {
                const picked = SKYBOXES.filter(function (s) { return s.id === skyConfig.preset; })[0];
                const nFaces = Object.keys(skyConfig.faces || {}).length;
                el.textContent = picked ? picked.name + " sky"
                    : (skyConfig.all ? "Custom sky " + skyConfig.all
                    : (skyConfig.name ? skyConfig.name + " sky"
                    : (nFaces ? "Custom sky, " + nFaces + "/6 faces" : "Skybox unchanged")));
                return;
            }
            if (dashMode === "advanced") {
                const k = swapCount();
                el.textContent = k + (k === 1 ? " skin swap" : " skin swaps");
                return;
            }
            let n = 0;
            OFFICIAL_WEAPON_DATA.forEach(function (w) {
                if (isCustom(currentConfig[w.name])) n++;
            });
            el.textContent = n + (n === 1 ? " skin configured" : " skins configured");
        }

        function filterWeapons() {
            const input = document.getElementById("searchInput");
            const query = (input && input.value ? input.value : "").toLowerCase();
            document.querySelectorAll("#dash-grid .weapon-card").forEach(function (card) {
                let visible = 0;
                card.querySelectorAll(".weapon-row, .sky-card").forEach(function (row) {
                    const match = (row.dataset.name || "").indexOf(query) !== -1;
                    row.style.display = match ? "flex" : "none";
                    if (match) visible++;
                });
                if (card.querySelectorAll(".weapon-row, .sky-card").length) {
                    card.style.display = visible ? "block" : "none";
                }
            });
        }

        function generateLuaCode() {
            let lines = [];
            OFFICIAL_WEAPON_DATA.forEach(w => {
                const skin = currentConfig[w.name] || "Default";
                if (skin !== "Default") {
                    lines.push(`${w.name}=${skin}`);
                }
            });
            const swapLines = generateSwapLines();
            if (swapLines.length) {
                lines.push("-- Skin swaps: Weapon | OwnedSkin > TargetSkin (equip OwnedSkin, it looks like TargetSkin)");
                lines = lines.concat(swapLines);
            }
            return lines.concat(generateWrapLines()).concat(generateSkyLines()).concat(generateLightLines()).join("\n");
        }

        function applyPreset(presetType) {
            if (dashMode === "wraps") {
                wrapConfig = presetType === "dev" ? { "Blue": "Glass", "Yellow": "Dark Matter" } : {};
                localStorage.setItem("rivals_wraps_saved", JSON.stringify(wrapConfig));
                renderGrid();
                filterWeapons();
                showToast(presetType === "dev" ? "Applied Dev Set: Blue looks like Glass, Yellow like Dark Matter" : "All wraps back to Default");
                return;
            }
            if (dashMode === "advanced") {
                if (presetType === "default") { advConfig = {}; saveAdvConfig(); renderGrid(); filterWeapons(); showToast("All skin swaps removed"); }
                return;
            }
            if (dashMode === "skybox") {
                if (presetType === "default") { lightConfig = {}; saveLightConfig(); onSkyChange({}); }
                return;
            }
            OFFICIAL_WEAPON_DATA.forEach(w => {
                if (presetType === "default") {
                    currentConfig[w.name] = "Default";
                } else if (presetType === "arch") {
                    const archMatch = w.skins.find(s => s.toLowerCase().includes("arch") || s.toLowerCase().includes("event horizon") || s.toLowerCase().includes("spy gloves") || s.toLowerCase().includes("singularity"));
                    currentConfig[w.name] = archMatch || "Default";
                } else if (presetType === "key") {
                    const keyMatch = w.skins.find(s => s.toLowerCase().includes("key"));
                    currentConfig[w.name] = keyMatch || "Default";
                } else if (presetType === "pixel") {
                    const pixelMatch = w.skins.find(s => s.toLowerCase().includes("pixel"));
                    currentConfig[w.name] = pixelMatch || "Default";
                }
            });

            localStorage.setItem("rivals_config_saved", JSON.stringify(currentConfig));
            renderGrid();
            filterWeapons();
            showToast(`Applied ${presetType.toUpperCase()} preset!`);
        }

        function openPreview() {
            const code = generateLuaCode();
            document.getElementById("previewTitle").textContent = "📜 " + configFileName() + " Output";
            document.getElementById("codeText").innerText = code || "-- Nothing configured yet (all Default)";
            document.getElementById("previewModal").style.display = "flex";
        }

        function closePreview() {
            document.getElementById("previewModal").style.display = "none";
        }

        function copyConfig() {
            const code = generateLuaCode();
            navigator.clipboard.writeText(code).then(() => {
                showToast("✅ Config copied to clipboard!");
            });
        }

        function downloadConfig() {
            const code = generateLuaCode();
            const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = configFileName();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("💾 " + configFileName() + " downloaded!");
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2600);
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById("previewModal")) closePreview();
            if (event.target === document.getElementById("skinModal")) closeSkinModal();
        };

        document.querySelectorAll(".nav-tab[data-toast]").forEach(function (b) {
            b.addEventListener("click", function () { showToast(b.dataset.toast + " is not wired up yet"); });
        });

        // The footbar comes after this script; wait for it before the first render.
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
    </script>
    <div class="footbar">
        <div class="foot-status"><span class="foot-dot"></span><span id="footCount">0 skins configured</span></div>
        <div class="foot-spacer"></div>
        <button class="btn-ghost btn-sm" onclick="copyConfig()">Copy</button>
        <button class="btn-primary btn-sm" id="footDownload" onclick="downloadConfig()">Download rivals_config.lua</button>
    </div>
</body>
</html>
